<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173d73"><meta name="description" content="记录作业、照片、订正和复习。">
<title>作业检查与复习</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:#18304c;background:#edf3f8;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #4da9dd;outline-offset:2px}.shell{max-width:1100px;margin:auto;padding:18px 22px 72px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:11px;font-size:1.16rem;font-weight:800}.logo{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:#173d73;color:white;font-size:1.4rem}.version{font-size:.84rem;color:#345f82;background:#dbeaf5;border-radius:99px;padding:7px 11px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:23px}.side{background:#173d73;color:white;border-radius:19px;padding:18px 12px;align-self:start}.side h2{font-size:.83rem;margin:7px 12px 16px;color:#b9d5f0}.nav{width:100%;text-align:left;background:transparent;border:0;color:#d8e9f8;border-radius:11px;padding:12px;margin:2px 0}.nav.active{background:#345f91;color:white;font-weight:700}.main{min-width:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 17px}.heading h1{margin:0;font-size:clamp(1.6rem,4vw,2.15rem)}.card,.stat{background:#fff;border:1px solid #d7e4ee;border-radius:17px;box-shadow:0 8px 28px #18304c0a}.card{padding:22px;margin-bottom:16px}.card h2{font-size:1.13rem;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px}.stat{padding:16px}.stat strong{display:block;font-size:1.7rem;color:#173d73}.stat span,.meta,.hint{color:#61758a;font-size:.9rem}.hint{line-height:1.55}.task{display:flex;justify-content:space-between;align-items:center;gap:14px;border-top:1px solid #e6eef4;padding:15px 0}.task:first-of-type{border-top:0}.task strong{display:block}.meta{margin:5px 0 0}.tag{display:inline-block;font-size:.78rem;color:#1f6596;background:#e6f1fa;border-radius:7px;padding:4px 7px;margin-right:7px;font-weight:700}.status{font-size:.83rem;font-weight:700;background:#f1f3f5;color:#5d6c7a;border-radius:99px;padding:6px 10px;white-space:nowrap}.status.ready{background:#fff0d2;color:#885b14}.status.done{background:#e0f4eb;color:#136446}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.primary,.secondary,.danger{border-radius:11px;padding:10px 15px;font-weight:700;border:1px solid transparent}.primary{background:#1765af;color:#fff}.primary:hover{background:#0d508e}.secondary{background:#fff;color:#225b8f;border-color:#b6cadb}.secondary:hover{background:#f1f8fc}.danger{background:#fff;color:#a63636;border-color:#e5b8b8}.small{padding:7px 10px;font-size:.88rem}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px;font-size:.91rem;font-weight:700}.field.wide{grid-column:1/-1}.field input,.field select,.field textarea{width:100%;min-height:44px;padding:10px 11px;border:1px solid #b8ccdc;border-radius:10px;background:white;color:#18304c}.field textarea{min-height:85px;resize:vertical}.notice{border-left:4px solid #4290c0;background:#eaf5fb;color:#285775;border-radius:9px;padding:12px 14px;margin:0 0 16px;line-height:1.55}.notice.warn{background:#fff6e7;border-color:#d9a340;color:#76541e}.empty{text-align:center;padding:26px;border:1px dashed #c3d6e5;border-radius:13px;color:#667c90}.detail{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:15px}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-top:13px}.photo{border:1px solid #d4e0ea;border-radius:12px;overflow:hidden;background:#f4f8fb}.photo img{width:100%;height:125px;object-fit:cover;display:block}.photo div{padding:8px}.photo button{margin-top:5px}.note,.review{border-top:1px solid #e6edf4;padding:14px 0}.note p,.review p{margin:7px 0;line-height:1.5;white-space:pre-wrap}.answer{background:#f1f7fb;border-radius:10px;padding:12px;margin:10px 0;white-space:pre-wrap}.diary-input{min-height:220px!important;line-height:1.75}.diary-result{border:1px solid #dce8f0;border-radius:12px;padding:14px;margin:12px 0}.diary-result h3{margin:0 0 8px;font-size:1rem}.diary-result ul{margin:0;padding-left:21px;line-height:1.65}.diary-result li{margin:5px 0}.diary-draft{min-height:190px!important;line-height:1.75}.diary-photo{max-width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:10px}.footer{font-size:.84rem;color:#667c90;margin-top:18px;line-height:1.5}dialog{border:0;border-radius:18px;box-shadow:0 22px 80px #173d7360;padding:22px;width:min(92vw,520px)}dialog::backdrop{background:#102d4a9a}dialog h2{margin:0 0 16px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173d73;color:white;padding:10px 16px;border-radius:10px;box-shadow:0 9px 25px #173d7355;max-width:90vw;z-index:3}.hidden{display:none!important}@media(max-width:760px){.shell{padding:15px 14px 65px}.layout{display:block}.side{display:flex;overflow-x:auto;gap:3px;padding:7px;margin-bottom:18px;border-radius:13px}.side h2{display:none}.nav{white-space:nowrap;width:auto;margin:0;padding:10px}.detail{grid-template-columns:1fr}}@media(max-width:520px){.version{display:none}.heading{align-items:flex-start;flex-direction:column}.card{padding:17px}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:1.45rem}.stat span{font-size:.79rem}.fields{grid-template-columns:1fr}.task{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand"><span class="logo" aria-hidden="true">✓</span>作业检查与复习</div><span class="version">ForChatGPT · v3</span></header><div class="layout"><nav class="side" aria-label="主导航"><h2>学习工作台</h2><button class="nav active" data-page="today">今日作业</button><button class="nav" data-page="review">错题复习</button><button class="nav" data-page="diary">日记检查</button><button class="nav" data-page="history">学习记录</button><button class="nav" data-page="settings">数据管理</button></nav><main id="main" class="main"></main></div><p class="footer">数据保存在此设备的浏览器中。照片不会自动发送给 AI；换设备或清除浏览器数据前请先导出备份。</p></div>
<dialog id="newDialog"><form id="newForm"><h2>新增作业</h2><div class="fields"><label class="field">科目<select name="subject"><option>数学</option><option>语文</option><option>英语</option><option>科学</option><option>其他</option></select></label><label class="field">截止日期<input type="date" name="due"></label><label class="field wide">作业名称<input name="title" required maxlength="80" placeholder="例如：数学练习册 第 12 页"></label><label class="field wide">作业要求<textarea name="description" maxlength="500" placeholder="要完成的页数或题目"></textarea></label></div><div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="secondary" id="cancelNew">取消</button><button class="primary">保存作业</button></div></form></dialog>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='homework-review-for-chatgpt-v2',main=document.getElementById('main'),dialog=document.getElementById('newDialog');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDay=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const plusDays=n=>{let d=new Date();d.setDate(d.getDate()+n);return localDay(d)};
const uid=()=>crypto.randomUUID?.()??String(Date.now()+Math.random());
let data={tasks:[],cards:[],diaries:[]};try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.tasks)&&Array.isArray(saved.cards))data={...saved,diaries:Array.isArray(saved.diaries)?saved.diaries:[]}}catch{};
let page='today',selected=null,shown=new Set(),toastTimer,diaryPhoto=null,diaryDraft='',activeDiaryId=null;
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{toast('保存失败：浏览器空间可能不足。请导出备份并减少照片。');return false}}
function status(t){return t.confirmed?'已查看':t.photos.length?(t.notes.some(n=>!n.corrected)?'待订正':'待检查'):'待完成'}
function title(text,actions=''){return `<div class="heading"><h1>${text}</h1>${actions}</div>`}
function taskRow(t){return `<div class="task"><div><span class="tag">${esc(t.subject)}</span><strong style="display:inline">${esc(t.title)}</strong><p class="meta">${esc(t.due||'未设日期')} · ${t.photos.length} 张照片 · ${t.notes.filter(n=>n.corrected).length}/${t.notes.length} 条已订正</p></div><div class="row"><span class="status ${t.confirmed?'done':t.photos.length?'ready':''}">${status(t)}</span><button class="secondary small" data-open="${esc(t.id)}">查看</button></div></div>`}
function render(){document.querySelectorAll('.nav').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-current',b.dataset.page===page?'page':'false')});if(page==='today')renderToday();else if(page==='detail')renderDetail();else if(page==='review')renderReview();else if(page==='diary')renderDiary();else if(page==='history')renderHistory();else renderSettings()}
function renderToday(){const due=data.cards.filter(c=>c.next<=localDay()).length;main.innerHTML=title('作业进度','<button class="primary" data-action="new">＋ 新增作业</button>')+`<div class="stats"><div class="stat"><strong>${data.tasks.length}</strong><span>全部作业</span></div><div class="stat"><strong>${data.tasks.filter(t=>t.photos.length).length}</strong><span>已上传照片</span></div><div class="stat"><strong>${due}</strong><span>今日待复习</span></div></div><section class="card"><h2>作业列表</h2>${data.tasks.length?data.tasks.map(taskRow).join(''):'<div class="empty">还没有作业。点击“新增作业”开始记录。</div>'}</section><p class="notice warn"><strong>AI 判题尚未接入。</strong>当前版本支持照片保存、人工记录问题、订正和复习，不能自动识别照片或判断答案。</p>`}
function renderDetail(){const t=data.tasks.find(x=>x.id===selected);if(!t){page='today';return render()}main.innerHTML=title(esc(t.title),'<button class="secondary" data-action="back">返回列表</button>')+`<div class="detail"><div><section class="card"><h2>作业照片</h2><p class="hint">选取清晰照片。每张会缩小后保存在此浏览器，最多 8 张；建议不要拍到姓名等个人信息。</p><input id="photos" type="file" accept="image/*" multiple aria-label="选择作业照片"><div class="photos">${t.photos.map((p,i)=>`<div class="photo"><img src="${p.data}" alt="第 ${i+1} 张作业照片"><div><span class="meta">${esc(p.name)}</span><br><button class="secondary small" data-remove-photo="${i}">删除</button></div></div>`).join('')}</div></section><section class="card"><h2>检查与订正</h2><p class="notice warn">请人工核对答案；这里记录的问题不代表 AI 检查结果。</p><div class="fields"><label class="field">题号<input id="question" maxlength="40" placeholder="例如：第 3 题"></label><label class="field">问题类型<select id="issueType"><option>答案需要订正</option><option>漏做</option><option>过程需要核对</option><option>字迹不清</option><option>表达可改进</option></select></label><label class="field wide">问题和提示<textarea id="issue" maxlength="1000" placeholder="写下需要重新检查的地方"></textarea></label></div><button class="primary" data-action="add-note" style="margin-top:13px">记录问题</button>${t.notes.map((n,i)=>`<div class="note"><strong>${esc(n.question||'未标题号')} · ${esc(n.type)}</strong><p>${esc(n.text)}</p><span class="status ${n.corrected?'done':'ready'}">${n.corrected?'已订正':'待订正'}</span> <button class="secondary small" data-correct="${i}">${n.corrected?'改回待订正':'标记已订正'}</button> <button class="danger small" data-remove-note="${i}">删除</button></div>`).join('')}</section></div><div><section class="card"><h2>作业信息</h2><p><strong>科目：</strong>${esc(t.subject)}</p><p><strong>截止：</strong>${esc(t.due||'未设置')}</p><p><strong>要求：</strong>${esc(t.description||'暂无')}</p><p><strong>状态：</strong>${status(t)}</p><button class="${t.confirmed?'secondary':'primary'}" data-action="confirm">${t.confirmed?'取消已查看':'家长已查看'}</button><p class="hint">“已查看”只表示看过作业和订正，不代表答案全部正确。</p><button class="danger small" data-action="delete-task">删除这份作业</button></section><section class="card"><h2>加入复习</h2><label class="field">知识点或题目<input id="prompt" maxlength="160" placeholder="例如：分数加法通分"></label><label class="field" style="margin-top:11px">解题思路<textarea id="answer" maxlength="1000" placeholder="写下正确思路"></textarea></label><button class="secondary" data-action="add-card" style="margin-top:12px">创建复习卡</button></section></div></div>`}
function renderReview(){const cards=[...data.cards].sort((a,b)=>a.next.localeCompare(b.next));main.innerHTML=title('错题复习')+`<section class="card"><p class="hint">先自己回想，再查看思路。选择“会了”安排 3 天后复习；“再练习”安排明天复习。</p>${cards.length?cards.map(c=>`<article class="review"><div class="row between"><strong>${esc(c.subject)} · ${esc(c.prompt)}</strong><span class="status ${c.next>localDay()?'done':'ready'}">${c.next<=localDay()?'今日复习':'已安排'}</span></div><p class="meta">下次复习：${esc(c.next)}</p><button class="secondary small" data-reveal="${esc(c.id)}">${shown.has(c.id)?'收起思路':'查看思路'}</button>${shown.has(c.id)?`<div class="answer">${esc(c.answer)}</div><div class="row"><button class="primary small" data-grade="${esc(c.id)}:yes">会了</button><button class="secondary small" data-grade="${esc(c.id)}:no">再练习</button><button class="danger small" data-delete-card="${esc(c.id)}">删除卡片</button></div>`:''}</article>`).join(''):'<div class="empty">还没有复习卡。进入作业详情即可添加。</div>'}</section>`}
function diaryFindings(original){
  const groups={typo:[],kanji:[],grammar:[],content:[]};let revised=original.trim();
  const typos=[['こんにちわ','こんにちは','问候语写作「こんにちは」。'],['こんばんわ','こんばんは','问候语写作「こんばんは」。'],['すごっく','すごく','促音「っ」多了一个。'],['たのしかた','たのしかった','过去式要写「かった」。'],['おもしろかた','おもしろかった','过去式要写「かった」。']];
  for(const [from,to,why] of typos)if(original.includes(from)){groups.typo.push(`「${from}」→「${to}」：${why}`);revised=revised.replaceAll(from,to)}
  const words=[['きょう','今日'],['きのう','昨日'],['あした','明日'],['わたし','私'],['ともだち','友達'],['がっこう','学校'],['せんせい','先生'],['べんきょう','勉強'],['じかん','時間'],['かぞく','家族'],['こうえん','公園'],['でんしゃ','電車'],['たのしい','楽しい'],['たのしかった','楽しかった'],['おもいました','思いました'],['いきました','行きました'],['かえりました','帰りました'],['たべました','食べました']];
  for(const [from,to] of words)if(original.includes(from))groups.kanji.push(`「${from}」→「${to}」を検討：小学校で習う漢字を使えます。前後の意味を確かめてから直しましょう。`);
  if(/[。！？]{2,}/.test(original))groups.grammar.push('句読点が続いています。一つにすると読みやすくなります。');
  if(/(?:そして|それから)/g.test(original)&&[...original.matchAll(/(?:そして|それから)/g)].length>=3)groups.grammar.push('「そして」「それから」が続いています。文を分けたり、別のつなぎ方を考えたりしましょう。');
  if(/(?:を行きました|を行った)/.test(original))groups.grammar.push('「を行きました」の前の場所を確認しましょう。目的地なら「へ／に行きました」が自然です。');
  if(revised&&!/[。！？]$/.test(revised)){groups.grammar.push('最後の文に「。」をつけましょう。');revised+='。'}
  if(original.length<45)groups.content.push('何をしたかに加えて、いつ・どこで・だれと・どんなことがあったかを一つ足すと伝わりやすくなります。');
  if(/楽しかったです|楽しかった。/.test(original))groups.content.push('「楽しかった」理由や、そのときの出来事を一つ書くと、気持ちが伝わります。');
  if(!/[思感嬉驚困残]|おも|うれし|びっくり|こまっ|たのし|楽しかっ/.test(original))groups.content.push('最後に、自分が感じたことや考えたことを一文加えてみましょう。');
  return {groups,revised};
}
function diaryGroup(label,items,empty){return `<section class="diary-result"><h3>${label} · ${items.length}件</h3>${items.length?`<ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<p class="hint">${empty}</p>`}</section>`}
function renderDiary(){const entry=data.diaries.find(x=>x.id===activeDiaryId),text=diaryDraft||'';main.innerHTML=title('日记检查')+`<section class="card"><p class="hint">日本小学六年级的日记。先输入文字，再检查；照片只作原稿参考，当前不能从照片自动识字。</p><label class="field">日记原文<textarea id="diaryText" class="diary-input" maxlength="5000" placeholder="例：きょうはともだちとこうえんに行きました。とても楽しかったです。">${esc(text)}</textarea></label><div class="row" style="margin-top:12px"><label class="secondary" style="cursor:pointer">添加原稿照片<input id="diaryPhotoInput" type="file" accept="image/*" hidden></label><button class="primary" data-action="check-diary">检查日记</button></div>${diaryPhoto?`<img class="diary-photo" src="${diaryPhoto}" alt="日记原稿照片"><button class="secondary small" data-action="remove-diary-photo">移除照片</button>`:''}<p class="hint">检查结果是常见写法的提示，不能完整判断所有错别字、六年级配当汉字和文意；请对照原稿确认。</p></section><div id="diaryFeedback"></div><section class="card"><h2>最近保存的日记</h2>${data.diaries.length?data.diaries.slice(0,10).map((d,i)=>`<div class="task"><div><strong>${esc(d.date)}</strong><p class="meta">${esc(d.original.slice(0,60))}</p></div><button class="secondary small" data-diary-open="${i}">打开</button></div>`).join(''):'<div class="empty">还没有保存的日记。</div>'}</section>`;if(entry&&diaryDraft===entry.original)showDiaryFeedback(entry.original,entry.revised)}
function showDiaryFeedback(original,revision){const {groups,revised}=diaryFindings(original);document.getElementById('diaryFeedback').innerHTML=`<section class="card"><h2>检查提示</h2>${diaryGroup('错别字候选',groups.typo,'未发现内置规则能判断的错误，仍需人工阅读。')}${diaryGroup('已学汉字候选',groups.kanji,'未发现内置词表中的假名写法。')}${diaryGroup('文法和标点',groups.grammar,'未发现内置规则能判断的问题。')}${diaryGroup('内容和思路',groups.content,'请确认事件经过和感受是否清楚。')}</section><section class="card"><h2>修改稿</h2><p class="hint">只自动修正明确的拼写和句末标点。汉字和内容提示请自己判断，并在下面修改。</p><label class="field">修改后的日记<textarea id="diaryRevision" class="diary-draft" maxlength="5000">${esc(revision??revised)}</textarea></label><button class="primary" data-action="save-diary" style="margin-top:12px">保存日记</button></section>`}
function renderHistory(){main.innerHTML=title('学习记录')+`<section class="card"><h2>作业与订正</h2>${data.tasks.length?data.tasks.map(taskRow).join(''):'<div class="empty">完成第一次作业后，这里会显示记录。</div>'}</section><section class="card"><h2>日记记录</h2>${data.diaries.length?data.diaries.map((d,i)=>`<div class="task"><div><strong>${esc(d.date)}</strong><p class="meta">${esc(d.original.slice(0,60))}</p></div><button class="secondary small" data-diary-open="${i}">查看</button></div>`).join(''):'<div class="empty">保存日记后，这里会显示记录。</div>'}</section>`}
function renderSettings(){main.innerHTML=title('数据管理')+`<section class="card"><h2>备份与恢复</h2><p class="hint">数据只在当前浏览器保存。导出 JSON 文件可留存备份；导入会替换当前所有记录，请先导出当前数据。</p><div class="row"><button class="primary" data-action="export">导出备份</button><label class="secondary" style="cursor:pointer">导入备份<input id="importFile" type="file" accept="application/json,.json" hidden></label></div></section><section class="card"><h2>清除数据</h2><p class="hint">会删除此浏览器中的全部作业、照片、复习卡和日记。</p><button class="danger" data-action="clear">清除全部记录</button></section>`}
function change(fn){fn();save();render()}
document.addEventListener('click',e=>{const el=e.target.closest('button[data-page],button[data-action],button[data-open],button[data-correct],button[data-remove-note],button[data-remove-photo],button[data-reveal],button[data-grade],button[data-delete-card],button[data-diary-open]');if(!el)return;const d=el.dataset;if(d.page){page=d.page;render();return}if(d.diaryOpen!==undefined){const entry=data.diaries[+d.diaryOpen];if(entry){diaryDraft=entry.original;diaryPhoto=entry.photo||null;activeDiaryId=entry.id;page='diary';render()}return}if(d.open){selected=d.open;page='detail';render();return}const t=data.tasks.find(x=>x.id===selected);if(d.correct!==undefined&&t)return change(()=>{t.notes[+d.correct].corrected=!t.notes[+d.correct].corrected;t.confirmed=false});if(d.removeNote!==undefined&&t){if(confirm('删除这条问题记录？'))change(()=>t.notes.splice(+d.removeNote,1));return}if(d.removePhoto!==undefined&&t){if(confirm('删除这张照片？'))change(()=>{t.photos.splice(+d.removePhoto,1);t.confirmed=false});return}if(d.reveal){shown.has(d.reveal)?shown.delete(d.reveal):shown.add(d.reveal);render();return}if(d.grade){const [id,result]=d.grade.split(':'),c=data.cards.find(x=>x.id===id);if(c)change(()=>{c.next=plusDays(result==='yes'?3:1);shown.delete(id)});return}if(d.deleteCard){if(confirm('删除这张复习卡？'))change(()=>{data.cards=data.cards.filter(x=>x.id!==d.deleteCard);shown.delete(d.deleteCard)});return}switch(d.action){case'check-diary':{const original=document.getElementById('diaryText').value.trim();if(!original){document.getElementById('diaryText').focus();toast('请先输入日记文字');return}diaryDraft=original;activeDiaryId=null;showDiaryFeedback(original);break}case'save-diary':{const original=document.getElementById('diaryText').value.trim(),revision=document.getElementById('diaryRevision')?.value.trim();if(!original||!revision){toast('请先检查并填写修改稿');return}change(()=>{const entry={id:uid(),date:localDay(),original,revised:revision,photo:diaryPhoto};data.diaries.unshift(entry);activeDiaryId=entry.id;diaryDraft=original});toast('日记已保存');break}case'remove-diary-photo':diaryPhoto=null;render();break;case'new':document.querySelector('[name=due]').value=localDay();dialog.showModal();break;case'back':page='today';render();break;case'confirm':if(t)change(()=>t.confirmed=!t.confirmed);break;case'add-note':{const text=document.getElementById('issue').value.trim();if(!text){document.getElementById('issue').focus();return}change(()=>{t.notes.push({question:document.getElementById('question').value.trim(),type:document.getElementById('issueType').value,text,corrected:false});t.confirmed=false});break}case'add-card':{const prompt=document.getElementById('prompt').value.trim(),answer=document.getElementById('answer').value.trim();if(!prompt||!answer){document.getElementById(prompt?'answer':'prompt').focus();return}change(()=>data.cards.push({id:uid(),subject:t.subject,prompt,answer,next:plusDays(1)}));toast('已加入复习');break}case'delete-task':if(t&&confirm('删除这份作业及照片和记录？'))change(()=>{data.tasks=data.tasks.filter(x=>x.id!==t.id);selected=null;page='today'});break;case'export':{const blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`homework-review-${localDay()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case'clear':if(confirm('确定清除全部记录？此操作无法撤销。'))change(()=>{data={tasks:[],cards:[],diaries:[]};selected=null;diaryDraft='';diaryPhoto=null;activeDiaryId=null;page='today'});break}});

document.getElementById('cancelNew').onclick=()=>dialog.close();document.getElementById('newForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('title')||'').trim();if(!name)return;change(()=>{const t={id:uid(),subject:String(f.get('subject')),title:name,due:String(f.get('due')),description:String(f.get('description')).trim(),photos:[],notes:[],confirmed:false};data.tasks.unshift(t);selected=t.id;page='detail'});e.target.reset();dialog.close()});
async function compress(file){const bitmap=await createImageBitmap(file),scale=Math.min(1,1400/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/jpeg',.73)}
document.addEventListener('input',e=>{if(e.target.id==='diaryText'){diaryDraft=e.target.value;activeDiaryId=null}});document.addEventListener('change',async e=>{if(e.target.id==='diaryPhotoInput'){const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>12*1024*1024){toast('请选择不超过 12 MB 的图片');return}try{diaryPhoto=await compress(file);render()}catch{toast('照片处理失败，请尝试另一张')}return}if(e.target.id==='photos'){const t=data.tasks.find(x=>x.id===selected);if(!t)return;const files=[...e.target.files];for(const file of files){if(t.photos.length>=8){toast('一份作业最多保存 8 张照片');break}if(!file.type.startsWith('image/')||file.size>12*1024*1024){toast('请选择不超过 12 MB 的图片');continue}try{const photo={name:file.name.slice(0,80),data:await compress(file)};t.photos.push(photo);t.confirmed=false;if(!save()){t.photos.pop();save();break}}catch{toast('照片处理失败，请尝试另一张')}}render()}else if(e.target.id==='importFile'){const file=e.target.files?.[0];if(!file)return;if(file.size>15*1024*1024){toast('备份文件过大');return}try{const parsed=JSON.parse(await file.text());if(![2,3].includes(parsed.version)||!Array.isArray(parsed.tasks)||!Array.isArray(parsed.cards)||!!parsed.diaries&&!Array.isArray(parsed.diaries)||parsed.tasks.some(t=>!t.id||!Array.isArray(t.photos)||!Array.isArray(t.notes))||parsed.cards.some(c=>!c.id||!c.prompt)||(parsed.diaries||[]).some(d=>!d.id||typeof d.original!=='string'||typeof d.revised!=='string')){throw Error('format')}if(!confirm('导入将替换当前全部记录，确定继续？'))return;const old=data;data={tasks:parsed.tasks,cards:parsed.cards,diaries:parsed.diaries||[]};if(!save())data=old;else{page='today';selected=null;render();toast('备份已导入')}}catch{toast('文件格式不正确，无法导入')}e.target.value=''}});render();
})();
</script></body></html>
